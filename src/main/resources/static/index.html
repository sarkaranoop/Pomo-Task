<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FocusFlow</title>
    <style>
        :root {
            --bg:         #0e0e10;
            --surface:    #16161a;
            --surface2:   #1e1e24;
            --surface3:   #26262e;
            --border:     #2a2a36;
            --ember:      #ff6b35;
            --ember-dim:  #c94e20;
            --cool:       #4fc3f7;
            --mint:       #4dd0a4;
            --amber:      #ffb347;
            --rose:       #f06292;
            --text:       #e8e8f0;
            --text-dim:   #8888a8;
            --text-faint: #44445a;
            --radius:     10px;
            --radius-sm:  6px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            min-height: 100vh;
        }

        /* ── APP LAYOUT ── */
        .app {
            display: grid;
            grid-template-columns: 360px 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas:
                "header header"
                "timer  board";
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            grid-area: header;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .logo-accent {
            color: var(--ember);
        }

        .header-stats {
            display: flex;
            gap: 24px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--text-dim);
        }

        .stat-val {
            color: var(--text);
            font-weight: 600;
        }

        /* ── TIMER PANEL ── */
        aside {
            grid-area: timer;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        main {
            grid-area: board;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── MODE TABS ── */
        .mode-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .mode-tab {
            flex: 1;
            padding: 12px 6px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .mode-tab.active {
            color: var(--ember);
        }

        /* ── TIMER RING ── */
        .timer-display-wrap {
            padding: 32px 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .timer-ring-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .timer-ring-svg {
            width: 200px;
            height: 200px;
            transform: rotate(-90deg);
        }

        .timer-ring-bg {
            fill: none;
            stroke: var(--surface2);
            stroke-width: 6;
        }

        .timer-ring-progress {
            fill: none;
            stroke: var(--ember);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 565;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .timer-time {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .timer-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* ── TIMER CONTROLS ── */
        .timer-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.15s;
        }

        .btn-icon:hover {
            border-color: var(--ember);
            color: var(--ember);
        }

        .btn-start {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--ember);
            background: transparent;
            color: var(--ember);
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .btn-start:hover {
            background: var(--ember);
            color: #fff;
        }

        .btn-start.running {
            border-color: var(--rose);
            color: var(--rose);
        }

        .btn-start.running:hover {
            background: var(--rose);
            color: #fff;
        }

        /* ── PIPS ── */
        .pomodoro-pips {
            display: flex;
            gap: 8px;
            padding: 0 28px;
        }

        .pip {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: var(--surface2);
            transition: background 0.3s;
        }

        .pip.done {
            background: var(--ember);
        }

        /* ── ACTIVE TASK CARD ── */
        .active-task-card {
            margin: 12px 16px 0;
            padding: 12px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-left: 4px solid var(--ember);
            border-radius: var(--radius);
        }

        .active-task-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ember);
            margin-bottom: 4px;
        }

        .active-task-title {
            font-size: 0.875rem;
            color: var(--text);
            line-height: 1.4;
        }

        .active-task-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 6px;
        }

        /* ── TIMER SETTINGS ── */
        .timer-settings {
            padding: 16px;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .settings-title {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .setting-item label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .setting-item input {
            width: 100%;
            padding: 6px 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.85rem;
            text-align: center;
            outline: none;
        }

        .setting-item input:focus {
            border-color: var(--ember);
        }

        /* ── BOARD ── */
        .board-header {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .board-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .btn-add {
            padding: 8px 16px;
            background: var(--ember);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-add:hover {
            background: var(--ember-dim);
            transform: translateY(-1px);
        }

        /* ── KANBAN ── */
        .kanban {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            overflow: hidden;
        }

        .kanban-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--border);
        }

        .kanban-col:last-child {
            border-right: none;
        }

        .col-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--border);
        }

        .col-header[data-col="todo"]        { border-bottom-color: var(--cool); }
        .col-header[data-col="in-progress"] { border-bottom-color: var(--amber); }
        .col-header[data-col="done"]        { border-bottom-color: var(--mint); }

        .col-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .col-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        [data-col="todo"] .col-dot        { background: var(--cool); }
        [data-col="in-progress"] .col-dot { background: var(--amber); }
        [data-col="done"] .col-dot        { background: var(--mint); }

        .col-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .col-count {
            font-size: 0.72rem;
            color: var(--text-dim);
            background: var(--surface2);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .col-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .col-body::-webkit-scrollbar { width: 3px; }
        .col-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* ── TASK CARDS ── */
        .task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            cursor: grab;
            transition: all 0.15s;
            position: relative;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .task-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: transparent;
            transition: background 0.2s;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .task-card:hover {
            border-color: var(--surface3);
            background: var(--surface2);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .task-card:hover::before         { background: var(--ember); }
        .task-card.active-focus          { border-color: var(--ember); box-shadow: 0 0 0 2px rgba(255,107,53,0.15); }
        .task-card.active-focus::before  { background: var(--ember); }

        .task-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .task-title {
            font-size: 0.86rem;
            font-weight: 500;
            line-height: 1.4;
            flex: 1;
        }

        .task-card-actions {
            display: flex;
            gap: 3px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .task-card:hover .task-card-actions { opacity: 1; }

        .task-action-btn {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: none;
            background: var(--surface3);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .task-action-btn:hover        { background: var(--ember); color: #fff; }
        .task-action-btn.delete:hover { background: var(--rose);  color: #fff; }

        .task-desc {
            font-size: 0.76rem;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .task-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pom-indicators {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .pom-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--surface3);
            border: 1px solid var(--border);
        }

        .pom-dot.done {
            background: var(--ember);
            border-color: var(--ember);
        }

        .pom-label {
            font-size: 0.66rem;
            color: var(--text-dim);
            margin-left: 4px;
        }

        .focus-btn {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: none;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s;
        }

        .focus-btn:hover,
        .focus-btn.active {
            border-color: var(--ember);
            color: var(--ember);
            background: rgba(255,107,53,0.1);
        }

        .kanban-col.drag-over .col-body {
            background: rgba(255,107,53,0.03);
            border-radius: var(--radius);
        }

        .empty-col {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-faint);
            font-size: 0.78rem;
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            z-index: 500;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 440px;
            max-width: 90vw;
            padding: 26px;
            transform: translateY(10px) scale(0.98);
            transition: transform 0.2s;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }

        .modal-overlay.open .modal {
            transform: translateY(0) scale(1);
        }

        .modal-title {
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 18px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 68px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--ember);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 18px;
        }

        .btn-cancel {
            padding: 8px 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-cancel:hover {
            color: var(--text);
            border-color: var(--text-dim);
        }

        .btn-save {
            padding: 8px 18px;
            background: var(--ember);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-save:hover {
            background: var(--ember-dim);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-left: 4px solid var(--ember);
            border-radius: var(--radius);
            padding: 12px 16px;
            max-width: 280px;
            z-index: 600;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-title {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 2px;
        }

        .toast-msg {
            color: var(--text-dim);
            font-size: 0.76rem;
        }
    </style>
</head>

<body>
<div class="app">

    <!-- SECTION 1: Header -->
    <header>
        <div class="logo">
            <span class="logo-icon">🍅</span>
            <span class="logo-text">Focus<span class="logo-accent">Flow</span></span>
        </div>
        <div class="header-stats">
            <div class="stat">
                <span class="stat-label">Sessions</span>
                <span class="stat-val" id="total-sessions">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Focus Time</span>
                <span class="stat-val" id="total-focus">0m</span>
            </div>
            <div class="stat">
                <span class="stat-label">Done</span>
                <span class="stat-val" id="tasks-done">0</span>
            </div>
        </div>
    </header>

    <!-- SECTION 2: Timer Panel -->
    <aside>

        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="focus" onclick="switchMode('focus')">🍅 Focus</button>
            <button class="mode-tab" data-mode="short" onclick="switchMode('short')">☕ Short Break</button>
            <button class="mode-tab" data-mode="long" onclick="switchMode('long')">🌙 Long Break</button>
        </div>

        <div class="timer-display-wrap">
            <div class="timer-ring-container">
                <svg class="timer-ring-svg" viewBox="0 0 200 200">
                    <circle class="timer-ring-bg" cx="100" cy="100" r="90"/>
                    <circle class="timer-ring-progress" id="ring-progress" cx="100" cy="100" r="90"/>
                </svg>
                <div class="timer-center">
                    <div class="timer-time" id="timer-display">25:00</div>
                    <div class="timer-label" id="timer-label">FOCUS SESSION</div>
                </div>
            </div>

            <div class="timer-controls">
                <button class="btn-icon" id="reset-btn" onclick="resetTimer()">↺</button>
                <button class="btn-start" id="start-btn" onclick="toggleTimer()">▶</button>
                <button class="btn-icon" id="skip-btn" onclick="skipSession()">⏭</button>
            </div>
        </div>

        <div class="pomodoro-pips" id="pom-pips">
            <div class="pip"></div>
            <div class="pip"></div>
            <div class="pip"></div>
            <div class="pip"></div>
        </div>

        <div class="active-task-card">
            <div class="active-task-label">Now Focusing</div>
            <div class="active-task-title" id="active-task-name">No task selected</div>
            <div class="active-task-meta" id="active-task-meta"></div>
        </div>

        <div class="timer-settings">
            <p class="settings-title">Timer Settings (minutes)</p>
            <div class="settings-grid">
                <div class="setting-item">
                    <label>Focus</label>
                    <input type="number" id="focus-dur" value="25" min="1" max="60" onchange="updateDurations()"/>
                </div>
                <div class="setting-item">
                    <label>Short Break</label>
                    <input type="number" id="short-dur" value="5" min="1" max="30" onchange="updateDurations()"/>
                </div>
                <div class="setting-item">
                    <label>Long Break</label>
                    <input type="number" id="long-dur" value="15" min="5" max="60" onchange="updateDurations()"/>
                </div>
            </div>
        </div>

    </aside>

    <!-- SECTION 3: Task Board -->
    <main>

        <div class="board-header">
            <h2 class="board-title">Task Board</h2>
            <button class="btn-add" onclick="openModal()">+ New Task</button>
        </div>

        <div class="kanban">

            <div class="kanban-col" id="col-todo"
                 ondragover="onDragOver(event,'todo')"
                 ondrop="onDrop(event,'todo')"
                 ondragleave="onDragLeave(event)">
                <div class="col-header" data-col="todo">
                    <div class="col-title-wrap">
                        <div class="col-dot"></div>
                        <span class="col-title">To Do</span>
                    </div>
                    <span class="col-count" id="count-todo">0</span>
                </div>
                <div class="col-body" id="body-todo"></div>
            </div>

            <div class="kanban-col" id="col-in-progress"
                 ondragover="onDragOver(event,'in-progress')"
                 ondrop="onDrop(event,'in-progress')"
                 ondragleave="onDragLeave(event)">
                <div class="col-header" data-col="in-progress">
                    <div class="col-title-wrap">
                        <div class="col-dot"></div>
                        <span class="col-title">In Progress</span>
                    </div>
                    <span class="col-count" id="count-in-progress">0</span>
                </div>
                <div class="col-body" id="body-in-progress"></div>
            </div>

            <div class="kanban-col" id="col-done"
                 ondragover="onDragOver(event,'done')"
                 ondrop="onDrop(event,'done')"
                 ondragleave="onDragLeave(event)">
                <div class="col-header" data-col="done">
                    <div class="col-title-wrap">
                        <div class="col-dot"></div>
                        <span class="col-title">Done</span>
                    </div>
                    <span class="col-count" id="count-done">0</span>
                </div>
                <div class="col-body" id="body-done"></div>
            </div>

        </div>
    </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal">
        <div class="modal-title">
            <span id="modal-heading">+ Add New Task</span>
        </div>
        <input type="hidden" id="edit-id"/>
        <div class="form-group">
            <label for="task-title">Title</label>
            <input type="text" id="task-title" placeholder="What needs to be done?"/>
        </div>
        <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" placeholder="Optional details..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="task-status">Status</label>
                <select id="task-status">
                    <option value="todo">To Do</option>
                    <option value="in-progress">In Progress</option>
                    <option value="done">Done</option>
                </select>
            </div>
            <div class="form-group">
                <label for="task-poms">Pomodoros</label>
                <input type="number" id="task-poms" value="1" min="1" max="12"/>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveTask()">Save Task</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
    <div class="toast-title" id="toast-title"></div>
    <div class="toast-msg" id="toast-msg"></div>
</div>

<script>
    // ── STATE ──
    let tasks          = [];
    let activeTaskId   = null;
    let dragTaskId     = null;
    let timerMode      = 'focus';
    let timerRunning   = false;
    let timerInterval  = null;
    let secondsLeft    = 25 * 60;
    let totalSeconds   = 25 * 60;
    let pomodoroCount  = 0;
    let sessionsDone   = 0;
    let totalFocusSeconds = 0;

    const MAX_POMS = 4;
    const durations = { focus: 25, short: 5, long: 15 };

    // ── API ──
    const API = '/api/tasks';

    async function apiGet() {
        try {
            const response = await fetch(API);
            return response.ok ? response.json() : null;
        } catch { return null; }
    }

    async function apiPost(data) {
        try {
            const response = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return response.ok ? response.json() : null;
        } catch { return null; }
    }

    async function apiPut(id, data) {
        try {
            const response = await fetch(`${API}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return response.ok ? response.json() : null;
        } catch { return null; }
    }

    async function apiDelete(id) {
        try {
            const response = await fetch(`${API}/${id}`, { method: 'DELETE' });
            return response.ok;
        } catch { return false; }
    }

    // ── HELPERS ──
    function genId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function esc(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    // ── RENDER BOARD ──
    function renderBoard() {
        ['todo', 'in-progress', 'done'].forEach(col => {
            const colTasks = tasks.filter(t => t.status === col);
            document.getElementById(`count-${col}`).textContent = colTasks.length;

            const body = document.getElementById(`body-${col}`);
            body.innerHTML = '';

            if (colTasks.length === 0) {
                body.innerHTML = '<div class="empty-col">No tasks here</div>';
            } else {
                colTasks.forEach(task => body.appendChild(createCard(task)));
            }
        });

        document.getElementById('tasks-done').textContent =
            tasks.filter(t => t.status === 'done').length;
    }

    // ── CREATE TASK CARD ──
    function createCard(task) {
        const card = document.createElement('div');
        card.className = 'task-card' + (task.id === activeTaskId ? ' active-focus' : '');
        card.dataset.id = task.id;
        card.draggable = true;

        const dots = Array.from({ length: task.pomodoroEstimated }, (_, i) =>
            `<div class="pom-dot ${i < task.pomodoroCompleted ? 'done' : ''}"></div>`
        ).join('');

        card.innerHTML = `
            <div class="task-card-top">
                <div class="task-title">${esc(task.title)}</div>
                <div class="task-card-actions">
                    <button class="task-action-btn" onclick="openEditModal('${task.id}')">✏</button>
                    <button class="task-action-btn delete" onclick="deleteTask('${task.id}')">✕</button>
                </div>
            </div>
            ${task.description ? `<div class="task-desc">${esc(task.description)}</div>` : ''}
            <div class="task-footer">
                <div class="pom-indicators">
                    ${dots}
                    <span class="pom-label">${task.pomodoroCompleted}/${task.pomodoroEstimated}</span>
                </div>
                <button class="focus-btn ${task.id === activeTaskId ? 'active' : ''}"
                    onclick="setFocus('${task.id}')">
                    ${task.id === activeTaskId ? 'Focusing' : 'Focus'}
                </button>
            </div>`;

        card.addEventListener('dragstart', e => {
            dragTaskId = task.id;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
            dragTaskId = null;
            card.classList.remove('dragging');
            document.querySelectorAll('.kanban-col')
                .forEach(c => c.classList.remove('drag-over'));
        });

        return card;
    }

    // ── TASK CRUD ──
    async function loadTasks() {
        const data = await apiGet();
        if (data) tasks = data;
        renderBoard();
    }

    async function saveTask() {
        const id    = document.getElementById('edit-id').value;
        const title = document.getElementById('task-title').value.trim();

        if (!title) {
            document.getElementById('task-title').focus();
            return;
        }

        const data = {
            title,
            description:       document.getElementById('task-desc').value.trim(),
            status:            document.getElementById('task-status').value,
            pomodoroEstimated: parseInt(document.getElementById('task-poms').value) || 1,
            pomodoroCompleted: 0
        };

        if (id) {
            const existing = tasks.find(t => t.id === id);
            if (existing) data.pomodoroCompleted = existing.pomodoroCompleted;
            const result = await apiPut(id, data);
            const index  = tasks.findIndex(t => t.id === id);
            if (index !== -1) tasks[index] = result || { ...tasks[index], ...data };
            showToast('Task Updated', title);
        } else {
            const result = await apiPost(data);
            tasks.push(result || { id: genId(), ...data });
            showToast('Task Added', title);
        }

        closeModal();
        renderBoard();
    }

    async function deleteTask(id) {
        await apiDelete(id);
        tasks = tasks.filter(t => t.id !== id);
        if (activeTaskId === id) { activeTaskId = null; updateActiveTask(); }
        renderBoard();
    }

    async function moveTask(id, newStatus) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        task.status = newStatus;
        await apiPut(id, task);
        renderBoard();
    }

    function setFocus(id) {
        activeTaskId = activeTaskId === id ? null : id;
        renderBoard();
        updateActiveTask();
    }

    function updateActiveTask() {
        const task = tasks.find(t => t.id === activeTaskId);
        document.getElementById('active-task-name').textContent =
            task ? task.title : 'No task selected';
        document.getElementById('active-task-meta').textContent =
            task ? `🍅 ${task.pomodoroCompleted} / ${task.pomodoroEstimated} pomodoros` : '';
    }

    // ── MODAL ──
    function openModal() {
        document.getElementById('edit-id').value            = '';
        document.getElementById('modal-heading').textContent = '+ Add New Task';
        document.getElementById('task-title').value         = '';
        document.getElementById('task-desc').value          = '';
        document.getElementById('task-status').value        = 'todo';
        document.getElementById('task-poms').value          = '1';
        document.getElementById('modal-overlay').classList.add('open');
        setTimeout(() => document.getElementById('task-title').focus(), 150);
    }

    function openEditModal(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        document.getElementById('edit-id').value            = id;
        document.getElementById('modal-heading').textContent = '✏ Edit Task';
        document.getElementById('task-title').value         = task.title;
        document.getElementById('task-desc').value          = task.description || '';
        document.getElementById('task-status').value        = task.status;
        document.getElementById('task-poms').value          = task.pomodoroEstimated;
        document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('open');
    }

    function handleOverlayClick(e) {
        if (e.target.id === 'modal-overlay') closeModal();
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
        if (e.key === 'Enter'
            && document.getElementById('modal-overlay').classList.contains('open')
            && document.activeElement.tagName !== 'TEXTAREA') {
            saveTask();
        }
    });

    // ── DRAG AND DROP ──
    function onDragOver(e, col) {
        e.preventDefault();
        document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
        document.getElementById(`col-${col}`).classList.add('drag-over');
    }

    function onDrop(e, col) {
        e.preventDefault();
        document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
        if (dragTaskId) moveTask(dragTaskId, col);
    }

    function onDragLeave(e) {
        if (!e.currentTarget.contains(e.relatedTarget))
            e.currentTarget.classList.remove('drag-over');
    }

    // ── TOAST ──
    let toastTimer = null;

    function showToast(title, msg) {
        document.getElementById('toast-title').textContent = title;
        document.getElementById('toast-msg').textContent   = msg;
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ── TIMER ──
    function switchMode(mode) {
        if (timerRunning) resetTimer();
        timerMode    = mode;
        secondsLeft  = durations[mode] * 60;
        totalSeconds = secondsLeft;

        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.mode === mode);
        });

        const labels = { focus: 'FOCUS SESSION', short: 'SHORT BREAK', long: 'LONG BREAK' };
        document.getElementById('timer-label').textContent = labels[mode];

        const ring = document.getElementById('ring-progress');
        const time = document.getElementById('timer-display');
        if (mode === 'focus') {
            ring.style.stroke = 'var(--ember)';
            time.style.color  = 'var(--text)';
        } else {
            ring.style.stroke = 'var(--cool)';
            time.style.color  = 'var(--cool)';
        }

        updateDisplay();
        updateRing();
    }

    function updateDurations() {
        durations.focus = parseInt(document.getElementById('focus-dur').value) || 25;
        durations.short = parseInt(document.getElementById('short-dur').value) || 5;
        durations.long  = parseInt(document.getElementById('long-dur').value)  || 15;
        if (!timerRunning) {
            secondsLeft  = durations[timerMode] * 60;
            totalSeconds = secondsLeft;
            updateDisplay();
            updateRing();
        }
    }

    function toggleTimer()  { timerRunning ? pauseTimer() : startTimer(); }
    function skipSession()  { onComplete(); }

    function startTimer() {
        timerRunning = true;
        document.getElementById('start-btn').textContent = '⏸';
        document.getElementById('start-btn').classList.add('running');

        timerInterval = setInterval(() => {
            secondsLeft--;
            if (timerMode === 'focus') {
                totalFocusSeconds++;
                document.getElementById('total-focus').textContent =
                    Math.floor(totalFocusSeconds / 60) + 'm';
            }
            updateDisplay();
            updateRing();
            if (secondsLeft <= 0) onComplete();
        }, 1000);
    }

    function pauseTimer() {
        timerRunning = false;
        clearInterval(timerInterval);
        document.getElementById('start-btn').textContent = '▶';
        document.getElementById('start-btn').classList.remove('running');
    }

    function resetTimer() {
        pauseTimer();
        secondsLeft  = durations[timerMode] * 60;
        totalSeconds = secondsLeft;
        updateDisplay();
        updateRing();
    }

    async function onComplete() {
        pauseTimer();

        if (timerMode === 'focus') {
            pomodoroCount++;
            sessionsDone++;
            document.getElementById('total-sessions').textContent = sessionsDone;

            if (activeTaskId) {
                const task = tasks.find(t => t.id === activeTaskId);
                if (task) {
                    task.pomodoroCompleted++;
                    await apiPut(activeTaskId, task);
                    renderBoard();
                    updateActiveTask();
                }
            }

            renderPips();

            if (pomodoroCount >= MAX_POMS) {
                pomodoroCount = 0;
                renderPips();
                switchMode('long');
                showToast('🎉 4 Pomodoros Done!', 'Take a long break!');
            } else {
                switchMode('short');
                showToast('🍅 Pomodoro Done!', 'Take a short break!');
            }
        } else {
            switchMode('focus');
            showToast('☕ Break Over', 'Time to focus!');
        }
    }

    function updateDisplay() {
        const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const s = String(secondsLeft % 60).padStart(2, '0');
        document.getElementById('timer-display').textContent = `${m}:${s}`;
        document.title = `${m}:${s} — FocusFlow`;
    }

    function updateRing() {
        const circumference = 2 * Math.PI * 90;
        const progress      = secondsLeft / (durations[timerMode] * 60);
        document.getElementById('ring-progress').style.strokeDasharray  = circumference;
        document.getElementById('ring-progress').style.strokeDashoffset = circumference * (1 - progress);
    }

    function renderPips() {
        const container = document.getElementById('pom-pips');
        container.innerHTML = '';
        for (let i = 0; i < MAX_POMS; i++) {
            const pip = document.createElement('div');
            pip.className = 'pip' + (i < pomodoroCount ? ' done' : '');
            container.appendChild(pip);
        }
    }

    // ── INIT ──
    renderPips();
    updateDisplay();
    updateRing();
    loadTasks();
</script>
</body>
</html>
