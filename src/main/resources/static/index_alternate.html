<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FocusFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #0e0e10;
          --surface: #16161a;
          --surface2: #1e1e24;
          --surface3: #26262e;
          --border: #2a2a36;
          --ember: #ff6b35;
          --ember-dim: #c94e20;
          --ember-glow: rgba(255, 107, 53, 0.15);
          --cool: #4fc3f7;
          --mint: #4dd0a4;
          --rose: #f06292;
          --amber: #ffb347;
          --text: #e8e8f0;
          --text-dim: #8888a8;
          --text-faint: #44445a;
          --radius: 10px;
          --radius-sm: 6px;
          --font-mono: 'Share Tech Mono', monospace;
          --font-head: 'Syne', sans-serif;
          --font-body: 'DM Sans', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          background: var(--bg);
          color: var(--text);
          font-family: var(--font-body);
          min-height: 100vh;
        }

        .app {
          display: grid;
          grid-template-rows: auto 1fr;
          grid-template-columns: 360px 1fr;
          grid-template-areas: "header header" "timer board";
          min-height: 100vh;
        }

        /* HEADER */
        header {
          grid-area: header;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 16px 28px;
          border-bottom: 1px solid var(--border);
          background: var(--surface);
          position: sticky;
          top: 0;
          z-index: 100;
        }

        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
          width: 30px; height: 30px;
          background: var(--ember);
          border-radius: 8px;
          display: flex; align-items: center; justify-content: center;
          font-size: 1rem;
          box-shadow: 0 0 16px rgba(255,107,53,0.4);
        }
        .logo-text { font-family: var(--font-head); font-weight: 800; font-size: 1.1rem; }
        .logo-text span { color: var(--ember); }

        .header-stats { display: flex; gap: 24px; }
        .stat { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-dim); }
        .stat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ember); }
        .stat-val { color: var(--text); font-family: var(--font-mono); }

        /* TIMER PANEL */
        .timer-panel {
          grid-area: timer;
          background: var(--surface);
          border-right: 1px solid var(--border);
          display: flex;
          flex-direction: column;
          position: sticky;
          top: 57px;
          height: calc(100vh - 57px);
          overflow-y: auto;
        }

        .mode-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .mode-tab {
          flex: 1; padding: 12px 6px;
          background: none; border: none;
          color: var(--text-dim);
          font-family: var(--font-head); font-size: 0.68rem;
          font-weight: 700; letter-spacing: 0.08em;
          text-transform: uppercase; cursor: pointer;
          transition: all 0.2s; position: relative;
        }
        .mode-tab::after {
          content: ''; position: absolute;
          bottom: 0; left: 0; right: 0; height: 2px;
          background: var(--ember); transform: scaleX(0); transition: transform 0.2s;
        }
        .mode-tab.active { color: var(--ember); }
        .mode-tab.active::after { transform: scaleX(1); }

        .timer-display-wrap {
          padding: 32px 28px 20px;
          display: flex; flex-direction: column;
          align-items: center; gap: 18px;
        }

        .timer-ring-container { position: relative; width: 200px; height: 200px; }
        .timer-ring-svg { width: 200px; height: 200px; transform: rotate(-90deg); }
        .timer-ring-bg { fill: none; stroke: var(--surface3); stroke-width: 6; }
        .timer-ring-progress {
          fill: none; stroke: var(--ember); stroke-width: 6;
          stroke-linecap: round; stroke-dasharray: 565;
          stroke-dashoffset: 0;
          filter: drop-shadow(0 0 8px rgba(255,107,53,0.5));
          transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }
        .timer-ring-progress.break-mode {
          stroke: var(--cool);
          filter: drop-shadow(0 0 8px rgba(79,195,247,0.5));
        }

        .timer-center {
          position: absolute; inset: 0;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 4px;
        }
        .timer-time {
          font-family: var(--font-mono); font-size: 2.8rem;
          color: var(--text); letter-spacing: 0.05em; line-height: 1;
        }
        .timer-time.break-mode { color: var(--cool); }
        .timer-label {
          font-family: var(--font-head); font-size: 0.6rem;
          font-weight: 700; letter-spacing: 0.15em;
          text-transform: uppercase; color: var(--text-dim);
        }

        .timer-controls { display: flex; align-items: center; gap: 14px; }
        .btn-icon {
          width: 38px; height: 38px; border-radius: 50%;
          border: 1px solid var(--border); background: var(--surface2);
          color: var(--text-dim); cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: all 0.15s; font-size: 0.9rem;
        }
        .btn-icon:hover { border-color: var(--ember); color: var(--ember); }

        .btn-start {
          width: 60px; height: 60px; border-radius: 50%;
          border: 2px solid var(--ember); background: var(--ember-glow);
          color: var(--ember); cursor: pointer; font-size: 1.4rem;
          display: flex; align-items: center; justify-content: center;
          transition: all 0.15s;
          box-shadow: 0 0 20px rgba(255,107,53,0.2);
        }
        .btn-start:hover { background: var(--ember); color: #fff; transform: scale(1.05); }
        .btn-start.running { border-color: var(--rose); color: var(--rose); background: rgba(240,98,146,0.1); }
        .btn-start.running:hover { background: var(--rose); color: #fff; }

        .pomodoro-pips { display: flex; gap: 8px; padding: 0 28px; }
        .pip { flex: 1; height: 4px; border-radius: 2px; background: var(--surface3); transition: background 0.3s; }
        .pip.done { background: var(--ember); }

        .active-task-card {
          margin: 12px 16px 0;
          padding: 12px 14px;
          background: var(--surface2);
          border: 1px solid var(--border);
          border-left: 3px solid var(--ember);
          border-radius: var(--radius);
        }
        .active-task-label {
          font-size: 0.62rem; font-family: var(--font-head);
          font-weight: 700; letter-spacing: 0.12em;
          text-transform: uppercase; color: var(--ember); margin-bottom: 4px;
        }
        .active-task-title { font-size: 0.875rem; color: var(--text); line-height: 1.4; }
        .active-task-meta { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); margin-top: 6px; }

        .timer-settings {
          padding: 16px; border-top: 1px solid var(--border); margin-top: auto;
        }
        .settings-title {
          font-size: 0.62rem; font-family: var(--font-head); font-weight: 700;
          letter-spacing: 0.12em; text-transform: uppercase;
          color: var(--text-faint); margin-bottom: 10px;
        }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .setting-item label { display: block; font-size: 0.65rem; color: var(--text-dim); margin-bottom: 4px; font-family: var(--font-mono); }
        .setting-item input {
          width: 100%; padding: 6px 8px;
          background: var(--surface3); border: 1px solid var(--border);
          border-radius: var(--radius-sm); color: var(--text);
          font-family: var(--font-mono); font-size: 0.85rem;
          text-align: center; outline: none;
        }
        .setting-item input:focus { border-color: var(--ember); }

        /* BOARD */
        .board-panel { grid-area: board; display: flex; flex-direction: column; overflow: hidden; }
        .board-header {
          padding: 18px 24px 14px;
          display: flex; align-items: center; justify-content: space-between;
          border-bottom: 1px solid var(--border);
        }
        .board-title { font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; }
        .btn-add {
          display: flex; align-items: center; gap: 6px;
          padding: 8px 16px; background: var(--ember);
          color: #fff; border: none; border-radius: var(--radius-sm);
          font-family: var(--font-head); font-weight: 700;
          font-size: 0.78rem; cursor: pointer; transition: all 0.15s;
        }
        .btn-add:hover { background: var(--ember-dim); transform: translateY(-1px); }

        .kanban { flex: 1; display: grid; grid-template-columns: repeat(3,1fr); overflow: hidden; }
        .kanban-col {
          display: flex; flex-direction: column;
          overflow: hidden; border-right: 1px solid var(--border);
        }
        .kanban-col:last-child { border-right: none; }

        .col-header {
          padding: 14px 18px 12px;
          display: flex; align-items: center; justify-content: space-between;
          border-bottom: 2px solid var(--border);
          background: var(--bg);
        }
        .col-header[data-col="todo"]        { border-bottom-color: var(--cool); }
        .col-header[data-col="in-progress"] { border-bottom-color: var(--amber); }
        .col-header[data-col="done"]        { border-bottom-color: var(--mint); }

        .col-title-wrap { display: flex; align-items: center; gap: 8px; }
        .col-dot { width: 7px; height: 7px; border-radius: 50%; }
        [data-col="todo"] .col-dot        { background: var(--cool); }
        [data-col="in-progress"] .col-dot { background: var(--amber); }
        [data-col="done"] .col-dot        { background: var(--mint); }

        .col-title {
          font-family: var(--font-head); font-weight: 700;
          font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
        }
        .col-count {
          font-family: var(--font-mono); font-size: 0.7rem;
          color: var(--text-faint); background: var(--surface2);
          padding: 2px 8px; border-radius: 20px;
        }

        .col-body {
          flex: 1; overflow-y: auto;
          padding: 12px 10px; display: flex; flex-direction: column; gap: 8px;
        }
        .col-body::-webkit-scrollbar { width: 3px; }
        .col-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* TASK CARD */
        .task-card {
          background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius); padding: 12px;
          cursor: grab; transition: all 0.15s; position: relative;
          animation: slideIn 0.2s ease;
        }
        @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
        .task-card::before {
          content: ''; position: absolute; top:0; left:0; right:0; height:2px;
          background: transparent; transition: background 0.2s;
          border-radius: var(--radius) var(--radius) 0 0;
        }
        .task-card:hover { border-color: var(--surface3); background: var(--surface2); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .task-card:hover::before { background: var(--ember); }
        .task-card.active-focus { border-color: var(--ember); box-shadow: 0 0 0 2px var(--ember-glow); }
        .task-card.active-focus::before { background: var(--ember); }

        .task-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .task-title { font-size: 0.86rem; font-weight: 500; line-height: 1.4; color: var(--text); flex: 1; }
        .task-card-actions { display: flex; gap: 3px; opacity: 0; transition: opacity 0.15s; }
        .task-card:hover .task-card-actions { opacity: 1; }
        .task-action-btn {
          width: 22px; height: 22px; border-radius: 4px; border: none;
          background: var(--surface3); color: var(--text-dim);
          cursor: pointer; font-size: 0.72rem;
          display: flex; align-items: center; justify-content: center; transition: all 0.1s;
        }
        .task-action-btn:hover { background: var(--ember); color: #fff; }
        .task-action-btn.delete:hover { background: var(--rose); }

        .task-desc { font-size: 0.76rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 10px; }

        .task-footer { display: flex; align-items: center; justify-content: space-between; }
        .pom-indicators { display: flex; gap: 4px; align-items: center; }
        .pom-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface3); border: 1px solid var(--border); }
        .pom-dot.done { background: var(--ember); border-color: var(--ember); }
        .pom-label { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-faint); margin-left: 4px; }

        .focus-btn {
          font-family: var(--font-head); font-size: 0.62rem; font-weight: 700;
          letter-spacing: 0.06em; text-transform: uppercase;
          padding: 3px 8px; border-radius: 4px;
          border: 1px solid var(--border); background: none;
          color: var(--text-dim); cursor: pointer; transition: all 0.15s;
        }
        .focus-btn:hover, .focus-btn.active { border-color: var(--ember); color: var(--ember); background: var(--ember-glow); }

        .kanban-col.drag-over .col-body { background: rgba(255,107,53,0.03); border-radius: var(--radius); }
        .drop-placeholder { height: 70px; border: 2px dashed var(--ember); border-radius: var(--radius); opacity: 0.3; display: none; }
        .kanban-col.drag-over .drop-placeholder { display: block; }

        .empty-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px 20px; color: var(--text-faint); text-align: center; font-size: 0.78rem; }

        /* MODAL */
        .modal-overlay {
          position: fixed; inset: 0; background: rgba(0,0,0,0.7);
          backdrop-filter: blur(4px);
          display: flex; align-items: center; justify-content: center;
          z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal {
          background: var(--surface); border: 1px solid var(--border);
          border-radius: 14px; width: 440px; max-width: 90vw; padding: 26px;
          transform: translateY(10px) scale(0.98); transition: transform 0.2s;
          box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }
        .modal-overlay.open .modal { transform: translateY(0) scale(1); }
        .modal-title { font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; margin-bottom: 18px; }
        .modal-title span { color: var(--ember); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.68rem; font-family: var(--font-head); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select {
          width: 100%; padding: 9px 12px;
          background: var(--surface2); border: 1px solid var(--border);
          border-radius: var(--radius-sm); color: var(--text);
          font-family: var(--font-body); font-size: 0.88rem; outline: none; transition: border-color 0.15s;
        }
        .form-group textarea { resize: vertical; min-height: 68px; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--ember); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
        .btn-cancel { padding: 8px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-dim); font-family: var(--font-head); font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
        .btn-cancel:hover { color: var(--text); border-color: var(--text-dim); }
        .btn-save { padding: 8px 18px; background: var(--ember); border: none; border-radius: var(--radius-sm); color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
        .btn-save:hover { background: var(--ember-dim); }

        /* TOAST */
        .toast {
          position: fixed; bottom: 24px; right: 24px;
          background: var(--surface2); border: 1px solid var(--border);
          border-left: 4px solid var(--ember); border-radius: var(--radius);
          padding: 12px 16px; max-width: 280px; z-index: 600;
          transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
          box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .toast.show { transform: translateX(0); }
        .toast-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 2px; }
        .toast-msg { color: var(--text-dim); font-size: 0.76rem; }
    </style>
</head>
<body>
<div class="app">

    <!-- HEADER -->
    <header>
        <div class="logo">
            <div class="logo-mark">🍅</div>
            <div class="logo-text">Focus<span>Flow</span></div>
        </div>
        <div class="header-stats">
            <div class="stat"><div class="stat-dot"></div>Sessions <span class="stat-val" id="total-sessions">0</span></div>
            <div class="stat"><div class="stat-dot" style="background:var(--cool)"></div>Focus Time <span class="stat-val" id="total-focus">0m</span></div>
            <div class="stat"><div class="stat-dot" style="background:var(--mint)"></div>Done <span class="stat-val" id="tasks-done">0</span></div>
        </div>
    </header>

    <!-- TIMER -->
    <aside class="timer-panel">
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="focus" onclick="switchMode('focus')">🍅 Focus</button>
            <button class="mode-tab" data-mode="short" onclick="switchMode('short')">☕ Short</button>
            <button class="mode-tab" data-mode="long" onclick="switchMode('long')">🌙 Long</button>
        </div>

        <div class="timer-display-wrap">
            <div class="timer-ring-container">
                <svg class="timer-ring-svg" viewBox="0 0 200 200">
                    <circle class="timer-ring-bg" cx="100" cy="100" r="90"/>
                    <circle class="timer-ring-progress" id="ring-progress" cx="100" cy="100" r="90"/>
                </svg>
                <div class="timer-center">
                    <div class="timer-time" id="timer-display">25:00</div>
                    <div class="timer-label" id="timer-label">FOCUS SESSION</div>
                </div>
            </div>

            <div class="timer-controls">
                <button class="btn-icon" onclick="resetTimer()" title="Reset">↺</button>
                <button class="btn-start" id="start-btn" onclick="toggleTimer()">▶</button>
                <button class="btn-icon" onclick="skipSession()" title="Skip">⏭</button>
            </div>
        </div>

        <div class="pomodoro-pips" id="pom-pips"></div>

        <div style="padding:0 16px; margin-top:14px;">
            <div class="active-task-card">
                <div class="active-task-label">Now Focusing</div>
                <div class="active-task-title" id="active-task-name">No task selected — pick one →</div>
                <div class="active-task-meta" id="active-task-meta"></div>
            </div>
        </div>

        <div class="timer-settings">
            <div class="settings-title">⚙ Timer Settings (minutes)</div>
            <div class="settings-grid">
                <div class="setting-item"><label>Focus</label><input type="number" id="focus-dur" value="25" min="1" max="60" onchange="updateDurations()"></div>
                <div class="setting-item"><label>Short</label><input type="number" id="short-dur" value="5" min="1" max="30" onchange="updateDurations()"></div>
                <div class="setting-item"><label>Long</label><input type="number" id="long-dur" value="15" min="5" max="60" onchange="updateDurations()"></div>
            </div>
        </div>
    </aside>

    <!-- BOARD -->
    <main class="board-panel">
        <div class="board-header">
            <div class="board-title">Task Board</div>
            <button class="btn-add" onclick="openModal()">+ New Task</button>
        </div>
        <div class="kanban">
            <div class="kanban-col" id="col-todo" data-col="todo" ondragover="onDragOver(event,'todo')" ondrop="onDrop(event,'todo')" ondragleave="onDragLeave(event)">
                <div class="col-header" data-col="todo">
                    <div class="col-title-wrap"><div class="col-dot"></div><div class="col-title">To Do</div></div>
                    <div class="col-count" id="count-todo">0</div>
                </div>
                <div class="col-body" id="body-todo"><div class="drop-placeholder"></div></div>
            </div>
            <div class="kanban-col" id="col-in-progress" data-col="in-progress" ondragover="onDragOver(event,'in-progress')" ondrop="onDrop(event,'in-progress')" ondragleave="onDragLeave(event)">
                <div class="col-header" data-col="in-progress">
                    <div class="col-title-wrap"><div class="col-dot"></div><div class="col-title">In Progress</div></div>
                    <div class="col-count" id="count-in-progress">0</div>
                </div>
                <div class="col-body" id="body-in-progress"><div class="drop-placeholder"></div></div>
            </div>
            <div class="kanban-col" id="col-done" data-col="done" ondragover="onDragOver(event,'done')" ondrop="onDrop(event,'done')" ondragleave="onDragLeave(event)">
                <div class="col-header" data-col="done">
                    <div class="col-title-wrap"><div class="col-dot"></div><div class="col-title">Done</div></div>
                    <div class="col-count" id="count-done">0</div>
                </div>
                <div class="col-body" id="body-done"><div class="drop-placeholder"></div></div>
            </div>
        </div>
    </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal">
        <div class="modal-title"><span id="modal-heading">+ Add New Task</span></div>
        <input type="hidden" id="edit-id">
        <div class="form-group"><label>Title *</label><input type="text" id="task-title" placeholder="What needs to be done?"></div>
        <div class="form-group"><label>Description</label><textarea id="task-desc" placeholder="Optional details..."></textarea></div>
        <div class="form-row">
            <div class="form-group"><label>Status</label>
                <select id="task-status">
                    <option value="todo">To Do</option>
                    <option value="in-progress">In Progress</option>
                    <option value="done">Done</option>
                </select>
            </div>
            <div class="form-group"><label>🍅 Pomodoros</label><input type="number" id="task-poms" value="1" min="1" max="12"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveTask()">Save Task</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
    <div class="toast-title" id="toast-title"></div>
    <div class="toast-msg" id="toast-msg"></div>
</div>

<script>
    // ─── STATE ───
    let tasks = [];
    let activeTaskId = null;
    let dragTaskId = null;
    let timerMode = 'focus';
    let timerRunning = false;
    let timerInterval = null;
    let secondsLeft = 25 * 60;
    let totalSeconds = 25 * 60;
    let pomodoroCount = 0;
    let sessionsDone = 0;
    let totalFocusSeconds = 0;
    const MAX_POMS = 4;
    const durations = { focus: 25, short: 5, long: 15 };

    // ─── API ───
    const API = '/api/tasks';

    async function apiGet()           { try { const r = await fetch(API); return r.ok ? r.json() : null; } catch { return null; } }
    async function apiPost(data)      { try { const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); return r.ok ? r.json() : null; } catch { return null; } }
    async function apiPut(id, data)   { try { const r = await fetch(`${API}/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); return r.ok ? r.json() : null; } catch { return null; } }
    async function apiDelete(id)      { try { const r = await fetch(`${API}/${id}`, { method:'DELETE' }); return r.ok; } catch { return false; } }

    // ─── TASKS ───
    function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

    async function loadTasks() {
      const data = await apiGet();
      if (data) tasks = data;
      renderBoard();
    }

    async function saveTask() {
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('task-title').value.trim();
      if (!title) { document.getElementById('task-title').focus(); return; }

      const data = {
        title,
        description: document.getElementById('task-desc').value.trim(),
        status: document.getElementById('task-status').value,
        pomodoroEstimated: parseInt(document.getElementById('task-poms').value) || 1,
        pomodoroCompleted: 0
      };

      if (id) {
        const existing = tasks.find(t => t.id === id);
        if (existing) data.pomodoroCompleted = existing.pomodoroCompleted;
        const result = await apiPut(id, data);
        const idx = tasks.findIndex(t => t.id === id);
        if (idx !== -1) tasks[idx] = result || { ...tasks[idx], ...data };
        showToast('Task Updated', title);
      } else {
        const result = await apiPost(data);
        tasks.push(result || { id: genId(), ...data });
        showToast('Task Added', title);
      }

      closeModal();
      renderBoard();
    }

    async function deleteTask(id) {
      await apiDelete(id);
      tasks = tasks.filter(t => t.id !== id);
      if (activeTaskId === id) { activeTaskId = null; updateActiveTask(); }
      renderBoard();
    }

    async function moveTask(id, newStatus) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.status = newStatus;
      await apiPut(id, task);
      renderBoard();
    }

    function setFocus(id) {
      activeTaskId = activeTaskId === id ? null : id;
      renderBoard();
      updateActiveTask();
    }

    function updateActiveTask() {
      const task = tasks.find(t => t.id === activeTaskId);
      document.getElementById('active-task-name').textContent = task ? task.title : 'No task selected — pick one →';
      document.getElementById('active-task-meta').textContent = task ? `🍅 ${task.pomodoroCompleted} / ${task.pomodoroEstimated} pomodoros` : '';
    }

    // ─── RENDER ───
    function renderBoard() {
      ['todo','in-progress','done'].forEach(col => {
        const colTasks = tasks.filter(t => t.status === col);
        document.getElementById(`count-${col}`).textContent = colTasks.length;
        const body = document.getElementById(`body-${col}`);
        body.innerHTML = '<div class="drop-placeholder"></div>';
        if (colTasks.length === 0) {
          body.innerHTML += '<div class="empty-col">Drop tasks here</div>';
        } else {
          colTasks.forEach(task => body.appendChild(createCard(task)));
        }
      });
      document.getElementById('tasks-done').textContent = tasks.filter(t => t.status === 'done').length;
    }

    function createCard(task) {
      const card = document.createElement('div');
      card.className = 'task-card' + (task.id === activeTaskId ? ' active-focus' : '');
      card.dataset.id = task.id;
      card.draggable = true;

      const dots = Array.from({ length: task.pomodoroEstimated }, (_, i) =>
        `<div class="pom-dot ${i < task.pomodoroCompleted ? 'done' : ''}"></div>`
      ).join('');

      card.innerHTML = `
        <div class="task-card-top">
          <div class="task-title">${esc(task.title)}</div>
          <div class="task-card-actions">
            <button class="task-action-btn" onclick="openEditModal('${task.id}')">✏</button>
            <button class="task-action-btn delete" onclick="deleteTask('${task.id}')">✕</button>
          </div>
        </div>
        ${task.description ? `<div class="task-desc">${esc(task.description)}</div>` : ''}
        <div class="task-footer">
          <div class="pom-indicators">${dots}<span class="pom-label">${task.pomodoroCompleted}/${task.pomodoroEstimated}</span></div>
          <button class="focus-btn ${task.id === activeTaskId ? 'active' : ''}" onclick="setFocus('${task.id}')">${task.id === activeTaskId ? 'Focusing' : 'Focus'}</button>
        </div>`;

      card.addEventListener('dragstart', e => { dragTaskId = task.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
      card.addEventListener('dragend', () => { dragTaskId = null; card.classList.remove('dragging'); document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over')); });
      return card;
    }

    function esc(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ─── DRAG & DROP ───
    function onDragOver(e, col) { e.preventDefault(); document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over')); document.getElementById(`col-${col}`).classList.add('drag-over'); }
    function onDrop(e, col) { e.preventDefault(); document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over')); if (dragTaskId) moveTask(dragTaskId, col); }
    function onDragLeave(e) { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over'); }

    // ─── MODAL ───
    function openModal() {
      document.getElementById('edit-id').value = '';
      document.getElementById('modal-heading').textContent = '+ Add New Task';
      document.getElementById('task-title').value = '';
      document.getElementById('task-desc').value = '';
      document.getElementById('task-status').value = 'todo';
      document.getElementById('task-poms').value = '1';
      document.getElementById('modal-overlay').classList.add('open');
      setTimeout(() => document.getElementById('task-title').focus(), 150);
    }

    function openEditModal(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      document.getElementById('edit-id').value = id;
      document.getElementById('modal-heading').textContent = '✏ Edit Task';
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-desc').value = task.description || '';
      document.getElementById('task-status').value = task.status;
      document.getElementById('task-poms').value = task.pomodoroEstimated;
      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    function handleOverlayClick(e) { if (e.target.id === 'modal-overlay') closeModal(); }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open') && document.activeElement.tagName !== 'TEXTAREA') saveTask();
    });

    // ─── TIMER ───
    function switchMode(mode) {
      if (timerRunning) resetTimer();
      timerMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      secondsLeft = totalSeconds = durations[mode] * 60;
      updateDisplay();
      updateRing();
      const isBreak = mode !== 'focus';
      document.getElementById('ring-progress').classList.toggle('break-mode', isBreak);
      document.getElementById('timer-display').classList.toggle('break-mode', isBreak);
      document.getElementById('timer-label').textContent = { focus:'FOCUS SESSION', short:'SHORT BREAK', long:'LONG BREAK' }[mode];
    }

    function updateDurations() {
      durations.focus = parseInt(document.getElementById('focus-dur').value) || 25;
      durations.short = parseInt(document.getElementById('short-dur').value) || 5;
      durations.long  = parseInt(document.getElementById('long-dur').value)  || 15;
      if (!timerRunning) { secondsLeft = totalSeconds = durations[timerMode] * 60; updateDisplay(); updateRing(); }
    }

    function toggleTimer() { timerRunning ? pauseTimer() : startTimer(); }

    function startTimer() {
      timerRunning = true;
      document.getElementById('start-btn').textContent = '⏸';
      document.getElementById('start-btn').classList.add('running');
      timerInterval = setInterval(() => {
        secondsLeft--;
        if (timerMode === 'focus') { totalFocusSeconds++; document.getElementById('total-focus').textContent = Math.floor(totalFocusSeconds/60) + 'm'; }
        updateDisplay(); updateRing();
        if (secondsLeft <= 0) onComplete();
      }, 1000);
    }

    function pauseTimer() {
      timerRunning = false; clearInterval(timerInterval);
      document.getElementById('start-btn').textContent = '▶';
      document.getElementById('start-btn').classList.remove('running');
    }

    function resetTimer() { pauseTimer(); secondsLeft = totalSeconds = durations[timerMode] * 60; updateDisplay(); updateRing(); }
    function skipSession() { onComplete(); }

    async function onComplete() {
      pauseTimer();
      if (timerMode === 'focus') {
        pomodoroCount++; sessionsDone++;
        document.getElementById('total-sessions').textContent = sessionsDone;
        if (activeTaskId) {
          const task = tasks.find(t => t.id === activeTaskId);
          if (task) { task.pomodoroCompleted++; await apiPut(activeTaskId, task); renderBoard(); updateActiveTask(); }
        }
        renderPips();
        if (pomodoroCount >= MAX_POMS) { pomodoroCount = 0; renderPips(); switchMode('long'); showToast('🎉 4 Done!', 'Take a long break!'); }
        else { switchMode('short'); showToast('🍅 Pomodoro Done!', 'Take a short break!'); }
      } else {
        switchMode('focus'); showToast('☕ Break Over', 'Time to focus!');
      }
    }

    function updateDisplay() {
      const m = String(Math.floor(secondsLeft/60)).padStart(2,'0');
      const s = String(secondsLeft%60).padStart(2,'0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
      document.title = `${m}:${s} — FocusFlow`;
    }

    function updateRing() {
      const circumference = 2 * Math.PI * 90;
      document.getElementById('ring-progress').style.strokeDasharray = circumference;
      document.getElementById('ring-progress').style.strokeDashoffset = circumference * (1 - secondsLeft / (durations[timerMode] * 60));
    }

    function renderPips() {
      const c = document.getElementById('pom-pips');
      c.innerHTML = '';
      for (let i = 0; i < MAX_POMS; i++) {
        const p = document.createElement('div');
        p.className = 'pip' + (i < pomodoroCount ? ' done' : '');
        c.appendChild(p);
      }
    }

    // ─── TOAST ───
    let toastTimer = null;
    function showToast(title, msg) {
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-msg').textContent = msg;
      const t = document.getElementById('toast');
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ─── INIT ───
    renderPips();
    updateDisplay();
    updateRing();
    loadTasks();
</script>
</body>
</html>
